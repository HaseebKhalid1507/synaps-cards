[package]
name = "cards-spec"
description = "The agent-card spec shared by the cards extension and synaps-desk: the doc schema, validation, the digest, the answer format."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# float_roundtrip: a number reads back as serde_json wrote it, every digit.
# Without it, a 17-digit number can parse one bit off (0.0012000000000000001
# as 0.0012), so normalizing is no fixed point, and a build where another
# crate turns it on would write other bytes, and another digest.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true

[features]
# Only for CI's second test lane: serde_json's maps keep insertion order, as
# they do in synaps-desk's build (gpui turns it on). Every byte this crate
# writes (the digest's preimage, an answer message) is the same either way.
preserve_order = ["serde_json/preserve_order"]

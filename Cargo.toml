[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/HaseebKhalid1507/synaps-cards"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.10, as synaps-desk (synaps-client) and SynapsCLI already lock it.
sha2 = { version = "0.10", default-features = false }
